plugins { id 'com.android.application' }

android {
    compileSdk 33
    defaultConfig {
        applicationId "com.yourname.ytwrapper"
        minSdk 19
        targetSdk 19
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    namespace 'com.yourname.ytwrapper'
}
